<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<meta name="theme-color" content="#000000"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black"/>
<meta name="apple-mobile-web-app-title" content="MDS Alarms"/>
<link rel="manifest" href="/manifest.json"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>
<title>MDS-D/DH Troubleshooting</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #fff; color: #000; font-size: 15px; }
.header { position: sticky; top: 0; z-index: 100; background: #000; color: #fff; padding: 12px 16px 0; }
.header-row1 { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.header-logo { font-size: 20px; }
.header-title { flex: 1; }
.header-title h1 { font-size: 14px; font-weight: 700; }
.header-title p { font-size: 10px; color: #666; }
.header-badge { font-size: 9px; background: #facc15; color: #000; padding: 2px 6px; border-radius: 3px; font-weight: 700; }
.lang-row { display: flex; gap: 4px; margin-bottom: 8px; }
.lang-btn { background: transparent; border: 1px solid #444; border-radius: 4px; color: #888; font-size: 11px; padding: 3px 8px; cursor: pointer; }
.lang-btn.active { background: #facc15; border-color: #facc15; color: #000; font-weight: 700; }
.search-wrap { position: relative; margin-bottom: 8px; }
.search-input { width: 100%; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 10px 36px 10px 14px; color: #fff; font-size: 15px; outline: none; }
.search-input::placeholder { color: #555; }
.search-clear { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); color: #555; font-size: 20px; cursor: pointer; background: none; border: none; }
.filters { display: flex; gap: 6px; padding-bottom: 10px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter-btn { flex-shrink: 0; padding: 5px 12px; border-radius: 20px; border: 1px solid #333; background: transparent; color: #999; font-size: 12px; cursor: pointer; }
.filter-btn.active { background: #facc15; border-color: #facc15; color: #000; font-weight: 700; }
.main { padding: 12px 16px 80px; }
.empty { text-align: center; padding: 40px 20px; color: #737373; }
.empty-icon { font-size: 44px; margin-bottom: 10px; }
.alarm-chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
.chip { padding: 4px 10px; border-radius: 4px; background: #f5f5f5; border: 1px solid #ddd; font-size: 12px; cursor: pointer; font-family: 'Courier New', monospace; font-weight: 700; }
.alarm-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 10px; padding: 14px; margin-bottom: 10px; cursor: pointer; border-left: 4px solid #ddd; }
.alarm-card.active { background: #f5f5f5; border-color: #000; }
.alarm-card-head { display: flex; align-items: flex-start; gap: 10px; }
.alarm-no { font-family: 'Courier New', monospace; font-size: 13px; font-weight: 800; background: #000; color: #facc15; padding: 3px 8px; border-radius: 4px; flex-shrink: 0; }
.alarm-name { font-size: 14px; font-weight: 600; flex: 1; line-height: 1.3; }
.alarm-badges { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }
.badge { font-size: 10px; padding: 2px 7px; border-radius: 3px; font-weight: 600; border: 1px solid; }
.alarm-detail { margin-top: 8px; font-size: 12px; color: #737373; line-height: 1.4; }
.detail-panel { background: #fff; border: 2px solid #000; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.detail-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 14px; }
.detail-no { font-family: 'Courier New', monospace; font-size: 22px; font-weight: 900; color: #dc2626; }
.detail-name { font-size: 16px; font-weight: 700; margin-top: 2px; line-height: 1.3; }
.close-btn { background: #f5f5f5; border: 1px solid #ddd; border-radius: 6px; width: 32px; height: 32px; font-size: 16px; cursor: pointer; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #737373; margin-bottom: 8px; text-transform: uppercase; }
.desc-box { background: #f5f5f5; border-left: 3px solid #000; border-radius: 0 6px 6px 0; padding: 10px 12px; margin-bottom: 14px; font-size: 13px; line-height: 1.5; color: #404040; }
.meta-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.meta-item { font-size: 11px; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 4px; padding: 4px 10px; }
.meta-label { color: #737373; }
.meta-val { font-weight: 700; }
.steps { margin-bottom: 14px; }
.step { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
.step-num { flex-shrink: 0; width: 24px; height: 24px; border-radius: 50%; background: #000; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.step-text { font-size: 13px; color: #404040; line-height: 1.5; padding-top: 3px; }
.remedies { background: #fffbeb; border: 1px solid #fde68a; border-radius: 8px; padding: 12px; margin-bottom: 14px; }
.remedy-item { display: flex; gap: 8px; margin-bottom: 6px; font-size: 12px; line-height: 1.4; }
.remedy-item:last-child { margin-bottom: 0; }
.notes-section { margin-bottom: 14px; }
.notes-textarea { width: 100%; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; font-size: 13px; color: #000; resize: none; min-height: 80px; outline: none; font-family: -apple-system, sans-serif; }
.notes-textarea:focus { border-color: #000; }
.notes-save-btn { margin-top: 6px; background: #000; color: #fff; border: none; border-radius: 6px; padding: 10px; font-size: 13px; cursor: pointer; width: 100%; font-weight: 600; }
.saved-note { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #166534; margin-bottom: 8px; }
.saved-note-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
.saved-note-date { font-size: 10px; }
.saved-note-del { background: none; border: none; color: #dc2626; font-size: 14px; cursor: pointer; }
.ai-section { border-top: 1px solid #e5e5e5; padding-top: 14px; }
.ai-btn { width: 100%; background: #000; color: #facc15; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; margin-bottom: 10px; }
.ai-btn:disabled { background: #ccc; color: #888; }
.ai-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
.ai-input { flex: 1; background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; }
.ai-input:focus { border-color: #000; }
.ai-ask-btn { background: #000; color: #fff; border: none; border-radius: 8px; padding: 10px 14px; font-size: 13px; cursor: pointer; font-weight: 600; }
.ai-response { background: #f5f5f5; border: 1px solid #e5e5e5; border-radius: 8px; padding: 12px; font-size: 13px; color: #404040; line-height: 1.6; white-space: pre-wrap; }
.ai-response-label { font-size: 10px; color: #737373; letter-spacing: 1px; margin-bottom: 8px; font-weight: 700; }
.ai-loading { text-align: center; padding: 20px; color: #737373; font-size: 13px; }
.ai-dot { display: inline-block; animation: bounce 0.8s infinite; }
.ai-dot:nth-child(2) { animation-delay: 0.2s; }
.ai-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
.install-banner { position: fixed; bottom: 0; left: 0; right: 0; background: #000; color: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 200; }
.install-text { flex: 1; font-size: 13px; }
.install-text strong { color: #facc15; }
.install-btn { background: #facc15; color: #000; border: none; border-radius: 6px; padding: 8px 14px; font-size: 13px; font-weight: 700; cursor: pointer; }
.install-dismiss { background: none; border: none; color: #666; font-size: 20px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <div class="header-row1">
    <div class="header-logo">⚡</div>
    <div class="header-title">
      <h1 id="appTitle">MDS-D/DH TROUBLESHOOTING</h1>
      <p id="appSubtitle">Mitsubishi CNC Drive Series · IB-1500025</p>
    </div>
    <span class="header-badge">FSE TOOL</span>
  </div>
  <div class="lang-row">
    <button class="lang-btn active" onclick="setLang('es')">ES</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('de')">DE</button>
    <button class="lang-btn" onclick="setLang('ja')">日本語</button>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="searchInput" type="text" placeholder="Código de alarma o palabra clave..." autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button class="search-clear" onclick="clearSearch()">×</button>
  </div>
  <div class="filters" id="filterRow"></div>
</div>

<div class="main" id="mainContent"></div>

<div id="installBanner" class="install-banner" style="display:none">
  <div class="install-text"><strong>MDS Alarms</strong> — <span id="installBannerText">Instala para usar sin internet</span></div>
  <button class="install-btn" onclick="installApp()" id="installBtnText">Instalar</button>
  <button class="install-dismiss" onclick="dismissInstall()">×</button>
</div>

<script>
const ALARMS = [
  { no:"11", name:"Axis Selection Error", type:"Drive", reset:"AR", applies:"SV SP",
    detail:"Setting of the axis No. selection switch is incorrect.",
    remedies:["Set axis No. correctly: 0=Axis1, 1=Axis2, 2=Axis3...", "Ensure no duplicate axis numbers exist between L and M axes", "If switch OK → Replace drive unit"],
    steps:["Check rotary switch on top of drive unit — look for duplicate axis numbers","Verify no other drive unit has the same axis number set","If all settings correct with no duplicates → Replace drive unit"] },
  { no:"12", name:"Memory Error 1", type:"Drive", reset:"AR", applies:"SV SP",
    detail:"CPU error or internal memory error detected during power ON self-check.",
    remedies:["Re-download correct software to correct unit (servo≠spindle)", "Improve ambient environment (temp, noise, grounding)", "Replace drive unit if error always repeats"],
    steps:["Check if servo/spindle software version was recently changed","If version changed: verify servo software not loaded in spindle or vice versa","Check repeatability — if always repeats → replace drive unit","Check ambient: temperature, noise sources, grounding quality"] },
  { no:"13", name:"Software Processing Error 1", type:"Drive", reset:"PR", applies:"SV SP",
    detail:"Software processing did not finish within specified time.",
    remedies:["Revert software version to original", "Improve ambient environment", "Replace drive unit"],
    steps:["Check if servo/spindle software version recently changed → revert to original","Check repeatability — if always repeats → replace drive unit","Check ambient environment: temperature, noise, grounding"] },
  { no:"16", name:"Magnetic Pole Position Detection Error", type:"Drive", reset:"PR", applies:"SV",
    detail:"Error detected in magnetic pole detection for controlling the motor.",
    remedies:["Set parameters from adjustment procedure correctly", "Replace drive unit if problem repeats"],
    steps:["Check that all parameters from adjustment procedure are correctly set","If parameters OK → check repeatability","If always repeats → Replace drive unit","Check ambient environment (temperature, noise, grounding)"] },
  { no:"17", name:"A/D Converter Error", type:"Drive", reset:"PR", applies:"SV SP",
    detail:"Error detected in A/D converter for detecting current FB.",
    remedies:["Replace drive unit if error repeats", "Improve ambient environment"],
    steps:["Check repeatability — if always repeats → replace drive unit","Check ambient environment: temperature, noise, grounding"] },
  { no:"18", name:"Motor Side Detector: Initial Communication Error", type:"Drive", reset:"PR", applies:"SV",
    detail:"Initial communication with motor end detector failed.",
    remedies:["Set SV025.ent correctly: OSE104=0, OSA104=1, all others=2", "Reinstall or replace detector cable", "Replace drive unit"],
    steps:["Check SV025.ent — OSE104:0, OSA104:1, all others=2 (except slave axis)","Jiggle detector connectors both sides — if loose → reinstall correctly","Power OFF, check detector cable with tester — if faulty → replace cable","Swap with another unit to determine if fault is drive side or detector side","Check detector ambient environment"] },
  { no:"1A", name:"Machine Side Detector: Initial Communication Error", type:"Drive", reset:"PR", applies:"SV",
    detail:"Initial communication with linear scale or ball screw end detector failed.",

  { no:"1B", name:"Machine Side Detector: Error 1", type:"Drive", reset:"PR", applies:"SV SP",

  { no:"1C", name:"Machine Side Detector: Error 2", type:"Drive", reset:"PR", applies:"SV",
    detail:"Machine side detector error. See separate table (1).",

    steps:["Follow all investigation steps for Alarm 1B"] },
  { no:"1D", name:"Machine Side Detector: Error 3", type:"Drive", reset:"PR", applies:"SV",
    detail:"Machine side detector error. See separate table (1).",
    remedies:["Follow same remedies as Alarm 1B"],
    steps:["Follow all investigation steps for Alarm 1B"] },
  { no:"1E", name:"Machine Side Detector: Error 4", type:"Drive", reset:"PR", applies:"SV",
    detail:"Machine side detector error. See separate table (1).",
    remedies:["Follow same remedies as Alarm 1B"],
    steps:["Follow all investigation steps for Alarm 1B"] },
  { no:"1F", name:"Machine Side Detector: Communication Error", type:"Drive", reset:"PR", applies:"SV",

  { no:"21", name:"Machine Side Detector: No Signal", type:"Drive", reset:"PR", applies:"SV",
    detail:"Excessive error alarm occurred with no signal from machine side detector.",
    remedies:["Correct SV025.pen for pulse vs serial type detector", "Replace detector cable", "Replace drive unit"],
    steps:["Check SV025.pen — ensure pulse type params not set for serial communication detector","Jiggle detector connectors — if loose → reinstall","Power OFF, check cable — if faulty → replace","Swap units to determine fault side","Check detector ambient environment"] },
  { no:"23", name:"Excessive Speed Error", type:"Drive", reset:"NR", applies:"SP",
    detail:"Speed command vs feedback difference exceeded 50 r/min continuously for longer than set time.",
    remedies:["Increase spindle accel/decel time constant", "Reduce cutting load if >120%", "Review power supply capacity if voltage drops during accel", "Increase drive unit capacity or replace unit"],
    steps:["Check U/V/W wiring between spindle drive unit and motor — if incorrect → reconnect","Check SP017, SP018, SP019, SP020, SP117, SP129+ values — if incorrect → set correctly","Measure accel/decel time to max speed. If <12sec during direction change → increase time constant","Check load during cutting. If ≥120% → reduce cutting load","Check input voltage during acceleration. If drops → review power supply capacity","Check drive unit capacity vs motor output. If insufficient → increase capacity"] },
  { no:"24", name:"Grounding", type:"Drive", reset:"PR", applies:"SV SP",
    detail:"Motor power cable is in contact with FG (Frame Ground).",
    remedies:["Replace motor or cable if insulation <1MΩ", "Clean oil from cannon connector and terminal box", "Replace drive unit if <100kΩ U/V/W to ground", "Replace power supply unit if >100kΩ"],

  { no:"25", name:"Absolute Position Data Lost", type:"Drive", reset:"AR", applies:"SV",

  { no:"26", name:"Unused Axis Error", type:"Drive", reset:"PR", applies:"SV SP",

    steps:["Check repeatability — if always repeats → replace drive unit","Check ambient environment (temperature, noise, grounding)"] },
  { no:"31", name:"Overspeed", type:"Drive", reset:"PR", applies:"SV SP",

  { no:"34", name:"NC-DRV Communication: CRC Error", type:"Drive", reset:"PR", applies:"SV SP",
    detail:"Error detected in data received from CNC.",
    remedies:["Replace communication cable between NC and drive", "Revert software version if recently changed", "Replace drive unit if fault is on drive side"],
    steps:["Shake connectors: NC↔drive unit, battery unit↔drive unit, between drive units — check for loose connections","Power OFF, check communication cables with tester — if faulty → replace cable","Check if NC or drive software recently changed — if yes → revert to original","Swap drive unit to determine if fault is NC side or drive side","Check ambient environment (temperature, noise, grounding)"] },
  { no:"35", name:"NC Command Error", type:"Drive", reset:"PR", applies:"SV SP",

    remedies:["Follow same remedies as Alarm 34"],
    steps:["Follow all investigation steps for Alarm 34"] },
  { no:"36", name:"NC-DRV Communication: Communication Error", type:"Drive", reset:"PR", applies:"SV SP",
    detail:"Communication with the CNC was interrupted.",
    remedies:["Follow same remedies as Alarm 34"],

  { no:"38", name:"NC-DRV Communication: Protocol Error 1", type:"Drive", reset:"PR", applies:"SV SP",

  { no:"39", name:"NC-DRV Communication: Protocol Error 2", type:"Drive", reset:"PR", applies:"SV SP",

    steps:["Follow all investigation steps for Alarm 34"] },

function rl(r) { return {NR:T.rNR,PR:T.rPR,AR:T.rAR,"*":T.rAuto}[r]||r; }

function setLang(l) {
  lang = l; T = LANGS[l];
  localStorage.setItem("mds_lang", l);
  filter = T.fAll; selected = null; aiResponse = "";
  document.getElementById("appTitle").textContent = T.appTitle;
  document.getElementById("appSubtitle").textContent = T.appSub;
  document.getElementById("searchInput").placeholder = T.ph;
  document.getElementById("installBannerText").textContent = T.iBanner;
  document.getElementById("installBtnText").textContent = T.iBtn;
  document.querySelectorAll(".lang-btn").forEach(b => {
    b.classList.toggle("active", b.textContent === (l==="ja"?"日本語":l.toUpperCase()));
  });
  render();
}

function render() {
  document.getElementById("filterRow").innerHTML =
    [[T.fAll,"fAll"],[T.fDrive,"Drive"],[T.fPower,"Power"],[T.fWarn,"Warning"]].map(([label,key])=>
      `<button class="filter-btn ${filter===label?"active":""}" onclick="setFilter('${label}')">${label}</button>`
    ).join("");
  const q = search.trim().toLowerCase();
  const main = document.getElementById("mainContent");
  if (!q && filter === T.fAll) { main.innerHTML = renderEmpty(); return; }
  const filtered = ALARMS.filter(a => {
    const mt = filter === T.fAll || a.type === filter;
    if (!q) return mt;
    return mt && (a.no.toLowerCase().startsWith(q) || a.name.toLowerCase().includes(q) || a.detail.toLowerCase().includes(q));
  });
  if (!filtered.length) {
    main.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div><p>${T.noRes} "${search}"</p><p style="font-size:12px;margin-top:6px;color:#aaa">${T.noResHint}</p></div>`;
    return;
  }
  main.innerHTML = filtered.map(renderCard).join("") +
    (selected ? `<div id="dp">${renderDetail(selected)}</div>` : "") +
    `<div style="height:40px"></div>`;
  if (selected) setTimeout(()=>{ const p=document.getElementById("dp"); if(p) p.scrollIntoView({behavior:"smooth",block:"start"}); },50);
}

function setFilter(f) { filter = f; render(); }

function renderEmpty() {
  return `<div class="empty">
    <div class="empty-icon">⚡</div>
    <p style="font-weight:700;font-size:16px;color:#000">${T.eTitle}</p>
    <p style="font-size:13px;margin-top:6px">${T.eHint}</p>
    <p style="font-size:11px;letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px;color:#aaa">${T.qLabel}</p>
    <div class="alarm-chips">
      ${["32","50","52","45","3B","25","67","73"].map(n=>`<span class="chip" onclick="quickSearch('${n}')">AL-${n}</span>`).join("")}
    </div>
    <div style="margin-top:20px;padding:12px;background:#f5f5f5;border-radius:8px;text-align:left;font-size:12px;color:#737373">
      <strong style="color:#000">📱 ${T.iHint}</strong>
    </div>
  </div>`;
}

  const c = TC[a.type]||"#000", sel = selected&&selected.no===a.no;
  const hasNote = notes[a.no]&&notes[a.no].length>0;
  return `<div class="alarm-card${sel?" active":""}" style="border-left-color:${c}" onclick="selectAlarm('${a.no}')">
    <div class="alarm-card-head">
      <span class="alarm-no">AL-${a.no}</span>
      <span class="alarm-name">${a.name}${hasNote?' <span style="color:#16a34a">●</span>':''}</span>
    </div>
    <div class="alarm-badges">
      <span class="badge" style="color:${c};border-color:${c};background:${TBG[a.type]||"#f5f5f5"}">${a.type}</span>
      <span class="badge" style="color:${RC[a.reset]};border-color:${RC[a.reset]};background:${RC[a.reset]}18">${rl(a.reset)}</span>
      <span class="badge" style="color:#737373;border-color:#ddd;background:#f5f5f5">${a.applies}</span>
    </div>
    <div class="alarm-detail">${a.detail}</div>
  </div>`;
}

function renderDetail(a) {
  const an = notes[a.no]||[];
  return `<div class="detail-panel">
    <div class="detail-header">
      <div><div class="detail-no">AL-${a.no}</div><div class="detail-name">${a.name}</div></div>
      <button class="close-btn" onclick="closeDetail()">✕</button>
    </div>
    <div class="meta-row">
      <div class="meta-item"><span class="meta-label">${T.mTipo}: </span><span class="meta-val" style="color:${TC[a.type]}">${a.type}</span></div>
      <div class="meta-item"><span class="meta-label">${T.mReset}: </span><span class="meta-val" style="color:${RC[a.reset]}">${rl(a.reset)}</span></div>
      <div class="meta-item"><span class="meta-label">${T.mAplica}: </span><span class="meta-val">${a.applies}</span></div>
    </div>
    <div class="section-label">${T.sDesc}</div>
    <div class="desc-box">${a.detail}</div>
    <div class="section-label">${T.sRem}</div>
    <div class="remedies">${a.remedies.map(r=>`<div class="remedy-item"><span>✅</span><span>${r}</span></div>`).join("")}</div>
    <div class="section-label">${T.sSteps}</div>
    <div class="steps">${a.steps.map((s,i)=>`<div class="step"><span class="step-num">${i+1}</span><span class="step-text">${s}</span></div>`).join("")}</div>
    <div class="section-label">${T.sNotes}</div>
    <div class="notes-section">
      ${an.map((n,i)=>`<div class="saved-note"><div class="saved-note-header"><span class="saved-note-date">${n.date}</span><button class="saved-note-del" onclick="delNote('${a.no}',${i})">🗑</button></div><div>${n.text}</div></div>`).join("")}
      <textarea class="notes-textarea" id="ni_${a.no}" placeholder="${T.nPh}" rows="3"></textarea>
      <button class="notes-save-btn" onclick="saveNote('${a.no}')">${T.nSave}</button>
    </div>
    <div class="ai-section">
      <div class="section-label">${T.sAI}</div>
      <button class="ai-btn" onclick="askAI('${a.no}','')" ${aiLoading?"disabled":""}>${aiLoading?T.aiLoading:T.aiBtn}</button>
      <div class="ai-input-row">
        <input class="ai-input" id="ai_${a.no}" type="text" placeholder="${T.aiPh}"/>
        <button class="ai-ask-btn" onclick="askAIQ('${a.no}')">${T.aiAsk}</button>
      </div>
      <div id="air_${a.no}">${aiResponse?`<div class="ai-response-label">${T.aiLbl}</div><div class="ai-response">${aiResponse}</div>`:""}</div>
    </div>
  </div>`;
}

function clearSearch() { search=""; document.getElementById("searchInput").value=""; selected=null; aiResponse=""; render(); }
function quickSearch(c) { search=c; document.getElementById("searchInput").value=c; selectAlarm(c); }
function selectAlarm(no) { if(selected&&selected.no===no){closeDetail();return;} selected=ALARMS.find(a=>a.no===no); aiResponse=""; render(); }
function closeDetail() { selected=null; aiResponse=""; render(); }

function saveNote(no) {
  const el=document.getElementById("ni_"+no); if(!el||!el.value.trim()) return;
  if(!notes[no]) notes[no]=[];
  notes[no].push({text:el.value.trim(), date:new Date().toLocaleDateString(lang==="ja"?"ja-JP":lang==="de"?"de-DE":lang==="en"?"en-US":"es-MX",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"})});
  localStorage.setItem("mds_notes",JSON.stringify(notes)); render();
}
function delNote(no,i) { if(!notes[no]) return; notes[no].splice(i,1); localStorage.setItem("mds_notes",JSON.stringify(notes)); render(); }

async function askAI(no, q) {
  const a=ALARMS.find(x=>x.no===no); if(!a||aiLoading) return;
  aiLoading=true; aiResponse="";
  const btn=document.querySelector(".ai-btn"); if(btn){btn.disabled=true;btn.textContent=T.aiLoading;}
  const r=document.getElementById("air_"+no); if(r) r.innerHTML=`<div class="ai-loading">...<span class="ai-dot">.</span><span class="ai-dot">.</span><span class="ai-dot">.</span></div>`;
  const ctx=`Alarm ${a.no} — ${a.name}\nType:${a.type} Reset:${a.reset} Applies:${a.applies}\nDesc:${a.detail}\nRemedies:${a.remedies.join("|")}\nSteps:${a.steps.join("|")}`;
  try {
    const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:T.aiSys,messages:[{role:"user",content:`${ctx}\n\n${q||T.aiQ(a.no,a.name)}`}]})});
    const data=await res.json(); aiResponse=data.content?.[0]?.text||"No response.";
  } catch(e){ aiResponse=T.aiErr; }
  aiLoading=false;
  if(btn){btn.disabled=false;btn.textContent=T.aiBtn;}
  if(r&&aiResponse) r.innerHTML=`<div class="ai-response-label">${T.aiLbl}</div><div class="ai-response">${aiResponse}</div>`;
}
function askAIQ(no){ const el=document.getElementById("ai_"+no); if(el&&el.value.trim()) askAI(no,el.value.trim()); }

function installApp(){ if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(()=>{deferredPrompt=null;document.getElementById("installBanner").style.display="none";});} }
function dismissInstall(){ document.getElementById("installBanner").style.display="none"; localStorage.setItem("installDismissed","1"); }
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(!localStorage.getItem("installDismissed"))document.getElementById("installBanner").style.display="flex";});
if("serviceWorker"in navigator) navigator.serviceWorker.register("/sw.js");
document.getElementById("searchInput").addEventListener("input",e=>{search=e.target.value;selected=null;aiResponse="";render();});
setLang(lang);
</script>
</body>
</html>
